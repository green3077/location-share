<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>사장님 주문 관리</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- 로그인 화면 -->
<div class="login-screen" id="screenLogin">
  <div class="login-card">
    <h1>사장님 주문 관리</h1>
    <p class="lead">비밀번호를 입력해주세요.</p>
    <input type="password" id="adminPin" placeholder="비밀번호" autocomplete="off" inputmode="numeric">
    <button id="btnAdminLogin" class="btn-primary">입장하기</button>
    <p class="login-error hidden" id="adminLoginError">비밀번호가 올바르지 않습니다.</p>
  </div>
</div>

<!-- 대시보드 화면 -->
<div class="dashboard hidden" id="screenDashboard">
  <header class="dash-header">
    <h1>주문 관리</h1>
    <div class="dash-stats">
      <div class="dash-stat">
        <div class="dash-stat-label">오늘 매출</div>
        <div class="dash-stat-value" id="statTodaySales">0원</div>
      </div>
      <div class="dash-stat">
        <div class="dash-stat-label">미결제 금액</div>
        <div class="dash-stat-value warn" id="statUnpaid">0원</div>
      </div>
      <div class="dash-stat">
        <div class="dash-stat-label">미완료 주문</div>
        <div class="dash-stat-value" id="statPendingCount">0건</div>
      </div>
    </div>
    <button class="btn-logout" id="btnAdminLogout">로그아웃</button>
  </header>

  <div class="staff-call-banner hidden" id="staffCallBanner"></div>

  <section class="table-merge-panel">
    <div class="table-merge-header">
      <h3>테이블 합치기</h3>
      <button class="table-merge-toggle" id="btnToggleMergePanel" type="button">펼치기</button>
    </div>
    <p class="table-merge-hint">같은 일행이 여러 테이블에 앉았을 때 두 개 이상 선택해서 합치면, 결제도 한 번에 처리할 수 있어요.</p>
    <div class="table-merge-body hidden" id="tableMergeBody">
      <div class="table-merge-picker" id="tableMergePicker"></div>
      <button class="table-merge-btn" id="btnMergeTables" type="button">선택한 테이블 합치기</button>
      <div class="table-merge-groups" id="tableMergeGroups"></div>
    </div>
  </section>

  <section class="table-summary" id="tableSummary"></section>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all" type="button">전체</button>
    <button class="filter-tab" data-filter="pending" type="button">미완료</button>
    <button class="filter-tab" data-filter="done" type="button">완료</button>
  </div>

  <div class="order-list" id="orderList"></div>
  <div class="order-list-empty hidden" id="orderListEmpty">표시할 주문이 없습니다.</div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
